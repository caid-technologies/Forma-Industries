name: Scene authoring
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:mcp
      - run: node --import tsx scripts/workspace-test.ts
      - run: npm run test:scene-links
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mcp-scenes-browser
