name: MCP client compatibility

on:
  pull_request:
    paths:
      - 'server/**'
      - 'scripts/mcp-doctor.mjs'
      - 'package*.json'
      - '.github/workflows/mcp.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'scripts/mcp-doctor.mjs'
      - 'package*.json'
      - '.github/workflows/mcp.yml'

permissions:
  contents: read

jobs:
  mcp:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run doctor:mcp
